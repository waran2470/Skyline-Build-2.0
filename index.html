<!doctype html>
<html lang="ja">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyline Build 2.0</title>
  </head>
  <body>
    <div id="app">
      <div id="hud">

        <h1>SKYLINE BUILD <em>2.0</em></h1>
